[project]
name = "agent-runtime"
version = "0.1.0"
description = "Governed agent runtime: LangGraph orchestration and PydanticAI agents that reach tools only through the MCP gateway."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "httpx2>=2.16",
    "langgraph>=1.2.24",
    "langgraph-checkpoint-postgres>=3.2.1",
    "mcp>=2.3,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
    "platform-telemetry",
    "psycopg-pool>=3.3",
    "psycopg[binary]>=3.3",
    "pydantic>=2.12,<3",
    "pydantic-ai-slim[anthropic]>=2.74",
    "pydantic-settings>=2.16",
    "python-jose[cryptography]>=3.5",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.uv.sources]
platform-telemetry = { workspace = true }
