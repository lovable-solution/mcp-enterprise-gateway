[project]
name = "platform-telemetry"
version = "0.1.0"
description = "Shared OpenTelemetry bootstrap for the platform's Python services."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "opentelemetry-api>=1.45",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-sdk>=1.45",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_telemetry"]
