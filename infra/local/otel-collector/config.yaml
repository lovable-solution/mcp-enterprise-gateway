# OpenTelemetry Collector (contrib): local telemetry pipeline.
#
#   services --OTLP--> collector --> Jaeger                      (traces)
#                                --> Prometheus scrape on :8889  (metrics, incl. span RED)
#                                --> stdout                      (logs, debug exporter)
#
# Services only ever know OTEL_EXPORTER_OTLP_ENDPOINT, so backends can change (e.g. AWS
# X-Ray / CloudWatch via an ADOT sidecar in ECS) without touching application config.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Refuse data before the container reaches its memory limit (docker-compose.yml).
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 20
  resource/environment:
    attributes:
      - key: deployment.environment.name
        value: local
        action: insert
  # Defence in depth: credentials must never reach a telemetry backend, even if an
  # instrumentation library is configured to capture request headers.
  attributes/scrub:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.request.header.x-api-key
        action: delete
  batch:
    timeout: 2s
    send_batch_size: 1024

connectors:
  # Request / error / duration metrics for every span, broken down per MCP method and
  # tool (OpenTelemetry MCP semantic-convention attributes set by the gateway).
  spanmetrics:
    histogram:
      explicit:
        buckets: [5ms, 10ms, 25ms, 50ms, 100ms, 250ms, 500ms, 1s, 2.5s, 5s, 10s, 30s]
    dimensions:
      - name: mcp.method.name
      - name: gen_ai.tool.name
    metrics_flush_interval: 15s

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true # container network only; never leaves the host
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: info
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, attributes/scrub, batch]
      exporters: [otlp/jaeger, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, resource/environment, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource/environment, attributes/scrub, batch]
      exporters: [debug]
