# Prometheus: local metrics store. Services never expose /metrics themselves; they push
# OTLP to the collector, which Prometheus scrapes.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Application metrics (latency, token spend, policy denials, ...) and span-derived
  # RED metrics. honor_labels keeps the job/instance labels the collector derives
  # from each service's service.name / service.instance.id.
  - job_name: otel-collector-export
    honor_labels: true
    static_configs:
      - targets: ["otel-collector:8889"]

  # The collector's own health: accepted / refused / dropped telemetry.
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["127.0.0.1:9090"]
