[project]
name = "mcp-gateway"
version = "0.1.0"
description = "Policy enforcement point and reverse proxy for downstream Model Context Protocol servers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "asyncpg>=0.32",
    "fastapi>=0.165",
    "httpx2>=2.16",
    "jsonschema>=4.25",
    "mcp>=2.3,<3",
    "opentelemetry-exporter-otlp-proto-http>=1.45",
    "opentelemetry-instrumentation-asyncpg>=0.66b2",
    "opentelemetry-sdk>=1.45",
    "platform-telemetry",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16",
    "python-jose[cryptography]>=3.5",
    "pyyaml>=6.0.2,<7",
    "redis>=8.2",
    "sse-starlette>=3.7",
    "uvicorn>=0.54",
]

[project.scripts]
mcp-gateway = "mcp_gateway.__main__:main"
mcp-gateway-policy = "mcp_gateway.policy.cli:main"
mcp-gateway-token = "mcp_gateway.devtools.mint_token:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_gateway"]

[tool.uv.sources]
platform-telemetry = { workspace = true }
