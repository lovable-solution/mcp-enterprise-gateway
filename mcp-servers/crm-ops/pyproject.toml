[project]
name = "crm-ops-mcp"
version = "0.1.0"
description = "Sample downstream MCP server: CRM account search, metrics and credit-limit changes."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
dependencies = [
    "mcp>=2.3,<3",
    "platform-telemetry",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.16",
    "python-jose[cryptography]>=3.5",
    "uvicorn>=0.54",
]

[project.scripts]
crm-ops-mcp = "crm_ops.__main__:main"

[tool.uv.sources]
platform-telemetry = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crm_ops"]
